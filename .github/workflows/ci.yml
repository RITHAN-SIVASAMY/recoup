name: ci

on:
  push: { branches: [main, "phase/**"] }
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src/recoup
      - run: uv run lint-imports
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: recoup, POSTGRES_PASSWORD: recoup, POSTGRES_DB: recoup }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recoup" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - run: uv run alembic upgrade head
      - name: train classifier, propensity and uplift on seeded data
        # Several unit/integration tests exercise the real trained artifacts
        # (e.g. test_classifier_explainer_is_built_exactly_once_and_reused
        # loads ml/artifacts/classifier/model.joblib) -- present on any dev
        # machine that's already run `make train`, absent on a fresh CI
        # runner, which is why this job never actually ran green.
        run: |
          uv run python ml/train_classifier.py
          uv run python ml/train_propensity.py
          uv run python ml/train_uplift.py
      - name: unit + property
        run: uv run pytest -m "unit or property" -q --cov=src/recoup --cov-report=xml
      - name: integration
        run: uv run pytest -m integration -q
      - name: chaos
        run: uv run pytest -m chaos -q
      - name: audit chain + replay equality
        run: uv run python -m recoup.cli verify

  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - name: train classifier, propensity and uplift on seeded data
        run: |
          uv run python ml/train_classifier.py
          uv run python ml/train_propensity.py
          uv run python ml/train_uplift.py
      - name: enforce metric gate
        run: uv run python scripts/metric_gate.py   # fails if macro-F1 < .85, Brier > .12, any AUC < .70, or Qini <= 0
      - uses: actions/upload-artifact@v4
        with:
          name: model-cards-and-metrics
          path: |
            ml/cards/
            ml/artifacts/**/metrics.json
            ml/artifacts/**/*.png

  llm-eval:
    runs-on: ubuntu-latest
    # A job-level `if:` cannot reference the `secrets` context -- only
    # `github`, `needs`, `vars` and `inputs` are available there ("Unrecognized
    # named-value: 'secrets'"). Gate inside the step instead, where `env` can
    # see it.
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --all-extras
      - name: grounded QA + PTP + message safety benchmarks
        env: { ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}" }
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY not set -- skipping the llm_eval suite"
            exit 0
          fi
          uv run pytest -m llm_eval -q
