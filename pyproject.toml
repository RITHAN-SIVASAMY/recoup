[project]
name = "recoup"
version = "0.1.0"
description = "Autonomous, risk-aware revenue recovery agent for Razorpay merchants."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "redis>=5.2",
    "arq>=0.26",
    "structlog>=24.4",
    "httpx>=0.27",
    "anthropic>=0.40",
    "typer>=0.13",
    "python-ulid>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ml = [
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "statsmodels>=0.14",
    "scipy>=1.14",
    "pandas>=2.2",
    "numpy>=2.1",
    "matplotlib>=3.9",
]
voice = [
    "edge-tts>=7.0",
    "faster-whisper>=1.0",
]
dev = [
    "ruff==0.16.5",  # pinned exactly, matching .pre-commit-config.yaml's rev -- an
    # unbounded constraint here let the two drift (v0.8.4 vs whatever `uv sync`
    # resolved), so the pre-commit hook and `ruff format --check` in CI disagreed
    # on formatting and fought each other on every commit
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-socket>=0.7",
    "hypothesis>=6.115",
    "freezegun>=1.5",
    "pre-commit>=4.0",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recoup"]

# ── ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "ml", "scripts"]
extend-exclude = ["context", "docs", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

# ── mypy ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["recoup.domain.*", "recoup.policy.*", "recoup.economics.*", "recoup.measurement.*", "recoup.audit.*"]
strict = true

# ── pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: fast, pure, no I/O, frozen clock",
    "property: Hypothesis-based invariant tests",
    "integration: compose-backed Postgres/Redis",
    "chaos: failure-injection scenarios",
    "llm_eval: golden-set evals against the live Anthropic API",
]

# ── coverage ────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/recoup"]
branch = true

# ── import-linter: domain has no internal deps; policy imports only domain ──
[tool.importlinter]
root_package = "recoup"

[[tool.importlinter.contracts]]
name = "Domain has no internal dependencies"
type = "forbidden"
source_modules = ["recoup.domain"]
forbidden_modules = [
    "recoup.ingestion", "recoup.understanding", "recoup.economics", "recoup.policy",
    "recoup.execution", "recoup.voice", "recoup.measurement", "recoup.audit",
    "recoup.llm", "recoup.api", "recoup.workers",
]

[[tool.importlinter.contracts]]
name = "Policy imports only domain"
type = "forbidden"
source_modules = ["recoup.policy"]
forbidden_modules = [
    "recoup.ingestion", "recoup.understanding", "recoup.economics",
    "recoup.execution", "recoup.voice", "recoup.measurement", "recoup.audit",
    "recoup.llm", "recoup.api", "recoup.workers",
]
